name: Pages

# Publishes the download site from /docs. The page never hard-codes a version:
# docs/assets/script.js asks the GitHub API for the latest release and points
# the download button at its APK, with the releases page as a fallback.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp release info (fallback for offline page loads)
        run: |
          set -euo pipefail
          if [ -f docs/VERSION ]; then
            VERSION=$(tr -d '[:space:]' < docs/VERSION)
          else
            VERSION="latest"
          fi
          echo "Publishing download page for ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        id: info

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
