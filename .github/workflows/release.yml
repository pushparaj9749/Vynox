name: Release

# Release builds are triggered deliberately: either by pushing a v* tag or by
# running this workflow manually. Ordinary commits never publish a release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag '$TAG' is not a vX.Y.Z release tag." >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify tests before releasing
        run: ./gradlew test --stacktrace --console=plain 2>&1 | tee release-tests.log

      - name: Restore signing keystore
        # The keystore is decoded from a secret into a temporary file that lives
        # outside the workspace and is removed in the cleanup step. Secrets are
        # never printed, never committed and never uploaded as artifacts.
        env:
          KEYSTORE_BASE64: ${{ secrets.VYNOX_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "VYNOX_KEYSTORE_BASE64 is not configured; building an unsigned APK." >&2
            echo "signed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE_PATH="$(mktemp -d)/vynox-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "Decoded keystore is empty - check the VYNOX_KEYSTORE_BASE64 secret." >&2
            exit 1
          fi
          echo "VYNOX_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VYNOX_KEYSTORE_FILE: ${{ env.VYNOX_KEYSTORE_FILE }}
          VYNOX_KEYSTORE_PASSWORD: ${{ secrets.VYNOX_KEYSTORE_PASSWORD }}
          VYNOX_KEY_ALIAS: ${{ secrets.VYNOX_KEY_ALIAS }}
          VYNOX_KEY_PASSWORD: ${{ secrets.VYNOX_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee release-build.log

      - name: Collect and verify APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p release-out
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "No APK was produced by assembleRelease." >&2
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          VERSION="${{ steps.tag.outputs.version }}"
          OUT="release-out/Vynox-${VERSION}.apk"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ] && [ "${signed:-false}" = "true" ]; then
            "$APKSIGNER" verify --print-certs "$OUT"
            echo "APK signature verified"
          else
            echo "APK is unsigned (no signing secrets configured)"
          fi
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=Vynox-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ steps.tag.outputs.tag }}^" 2>/dev/null || true)
          {
            echo "## Vynox ${{ steps.tag.outputs.version }}"
            echo
            echo "Signed Android APK built by GitHub Actions from tag \`${{ steps.tag.outputs.tag }}\`."
            echo
            echo "### Install"
            echo "1. Download **Vynox-${{ steps.tag.outputs.version }}.apk** below."
            echo "2. Open it on your device and allow installs from this source if asked."
            echo "3. Tap Install, then open Vynox."
            echo
            echo "Requires Android 8.0 (API 26) or newer."
            echo
            echo "### Changes"
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:'- %s' "$PREV_TAG..${{ steps.tag.outputs.tag }}"
            else
              git log --no-merges --pretty=format:'- %s' "${{ steps.tag.outputs.tag }}"
            fi
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Vynox ${{ steps.tag.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update download page release info
        # The Pages site resolves the newest APK from the GitHub API at page load
        # time, so this step only records the current version for humans.
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '%s\n' "${{ steps.tag.outputs.tag }}" > docs/VERSION
          printf -- '- **%s** — APK published as \`%s\`\n' \
            "${{ steps.tag.outputs.version }}" "${{ steps.apk.outputs.name }}" >> CHANGELOG.md
          cat docs/VERSION

      - name: Commit changelog
        # Only branch runs can push; tag-triggered runs leave the repository alone
        # (the release notes already live on the GitHub Release itself).
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/VERSION
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "docs: record release ${{ steps.tag.outputs.tag }}"
            git push origin HEAD:"${GITHUB_REF#refs/heads/}" || \
              echo "Changelog commit could not be pushed (branch protection?); the release is unaffected."
          fi

      - name: Trigger Pages deployment
        if: success()
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" || \
            echo "Pages workflow will run on the next push to the default branch."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing files
        if: always()
        run: |
          rm -f "${VYNOX_KEYSTORE_FILE:-}" || true
          rm -rf "$(dirname "${VYNOX_KEYSTORE_FILE:-/tmp}")" 2>/dev/null || true
          rm -f release-build.log release-tests.log || true
          echo "Temporary signing files removed."

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            release-tests.log
            release-build.log
          retention-days: 7
          if-no-files-found: ignore
